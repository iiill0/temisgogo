<title>캐릭터 프로필 스튜디오</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Syncopate:wght@400;700&family=Michroma&family=Noto+Sans+KR:wght@400;500;700;800;900&display=swap">
<style>
/* Layout: sticky toolbar with card tabs; editor form column + live, scaled 1000px card preview. Dark-first studio. */
:root{
  --bg:#0d0e14; --panel:#15161f; --panel-2:#1c1d29; --line:#2a2c3b; --fg:#ecebf3; --muted:#9a9ab0;
  --accent:#7c8cff; --accent-fg:#0b0c14; --danger:#ff6b7f; --ok:#4fd6a4;
  --f-ui:"Noto Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-wide:"Michroma","Syncopate","Noto Sans KR",sans-serif;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){ :root:not([data-theme="dark"]){
  --bg:#eef0f6; --panel:#ffffff; --panel-2:#f4f5fa; --line:#d9dbe6; --fg:#171823; --muted:#62647a;
  --accent:#4453e0; --accent-fg:#ffffff; --danger:#d23b55; --ok:#18915f; color-scheme:light } }
:root[data-theme="light"]{
  --bg:#eef0f6; --panel:#ffffff; --panel-2:#f4f5fa; --line:#d9dbe6; --fg:#171823; --muted:#62647a;
  --accent:#4453e0; --accent-fg:#ffffff; --danger:#d23b55; --ok:#18915f; color-scheme:light }
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-ui);font-size:14px;margin:0}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ---------- top bar ---------- */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--panel)}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--panel);border-bottom:1px solid var(--line);
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center}
.brand{font-family:var(--f-wide);font-size:11px;letter-spacing:.22em;white-space:nowrap}
.brand b{color:var(--accent);font-weight:400}
.tabs{display:flex;gap:6px;flex:1 1 300px;min-width:0;overflow-x:auto;scrollbar-width:thin;padding-block:2px}
.tab{display:flex;align-items:center;gap:8px;padding:7px 12px;border-radius:8px;border:1px solid var(--line);background:var(--panel-2);
  cursor:pointer;white-space:nowrap;font-family:var(--f-wide);font-size:10.5px;letter-spacing:.14em}
.tab i{width:8px;height:8px;border-radius:50%;flex:none}
.tab[aria-current="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.tab.add{font-family:var(--f-ui);letter-spacing:0;font-size:13px;color:var(--muted)}
.actions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 13px;border-radius:8px;border:1px solid var(--line);background:var(--panel-2);cursor:pointer;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--danger)}
.btn:disabled{opacity:.5;cursor:default}
.status{font-size:12px;color:var(--muted);white-space:nowrap}
.status.dirty{color:#f0b54a}.status.ok{color:var(--ok)}.status.err{color:var(--danger)}
.menu{position:relative}
.menu-pop{position:absolute;right:0;top:calc(100% + 6px);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px;min-width:220px;
  box-shadow:0 12px 32px rgba(0,0,0,.35);display:flex;flex-direction:column;z-index:40}
.menu-pop[hidden]{display:none}
.menu-pop button{text-align:left;background:none;border:0;padding:9px 10px;border-radius:6px;cursor:pointer}
.menu-pop button:hover{background:var(--panel-2)}
.menu-pop small{display:block;color:var(--muted);font-size:11.5px;margin-top:2px}

/* ---------- main ---------- */
.main{display:grid;grid-template-columns:minmax(330px,420px) minmax(0,1fr);gap:20px;
  padding-block:18px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.main.view{grid-template-columns:minmax(0,1fr)}
.main.view .editor{display:none}
.seg{display:none}
@media (max-width:900px){
  .main{grid-template-columns:minmax(0,1fr)}
  .seg{display:flex;gap:4px;background:var(--panel-2);border:1px solid var(--line);border-radius:9px;padding:3px}
  .seg button{flex:1;border:0;background:none;padding:7px 10px;border-radius:7px;cursor:pointer}
  .seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg)}
  .main[data-pane="edit"] .preview-col{display:none}
  .main[data-pane="preview"] .editor{display:none}
  .main.view .seg{display:none}
}
.editor{display:flex;flex-direction:column;gap:10px;min-width:0}
.notice{background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:13px;color:var(--muted);line-height:1.6}
.notice b{color:var(--fg)}
details.grp{background:var(--panel);border:1px solid var(--line);border-radius:12px}
details.grp>summary{list-style:none;cursor:pointer;padding:13px 14px;display:flex;align-items:center;gap:10px;font-weight:700}
details.grp>summary::-webkit-details-marker{display:none}
details.grp>summary::after{content:"";margin-left:auto;width:7px;height:7px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg);transition:transform .15s}
details.grp[open]>summary::after{transform:rotate(-135deg)}
details.grp>summary .en{font-family:var(--f-wide);font-size:9.5px;letter-spacing:.2em;color:var(--muted);font-weight:400}
.grp-body{padding:2px 14px 16px;display:flex;flex-direction:column;gap:12px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.row.r3{grid-template-columns:1.1fr .9fr 1fr .6fr}
.f{display:flex;flex-direction:column;gap:5px;min-width:0}
.f>span{font-size:12px;color:var(--muted)}
.f>span em{font-style:normal;color:var(--accent)}
.f input[type=text],.f input[type=number],.f textarea{width:100%;background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:8px 10px;min-width:0}
.f textarea{resize:vertical;line-height:1.6;min-height:70px}
.f input:focus,.f textarea:focus{border-color:var(--accent);outline:none}
.colors{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.swatch{display:flex;align-items:center;gap:8px;background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:5px 10px 5px 5px;font-size:12px;color:var(--muted)}
.swatch input{width:30px;height:26px;border:0;padding:0;background:none;cursor:pointer}
.presets{display:flex;gap:6px;flex-wrap:wrap}
.presets button{width:22px;height:22px;border-radius:50%;border:2px solid var(--panel);box-shadow:0 0 0 1px var(--line);cursor:pointer}
.imgbox{display:grid;grid-template-columns:96px 1fr;gap:12px;align-items:start}
.thumb{width:96px;height:96px;border-radius:8px;background:var(--panel-2) center/cover no-repeat;border:1px dashed var(--line);display:grid;place-items:center;color:var(--muted);font-size:11px;text-align:center}
.sliders{display:flex;flex-direction:column;gap:6px}
.sl{display:grid;grid-template-columns:34px 1fr 34px;gap:8px;align-items:center;font-size:12px;color:var(--muted)}
.sl input{width:100%;accent-color:var(--accent)}
.sl output{text-align:right;font-variant-numeric:tabular-nums}
.img-actions{display:flex;gap:6px;flex-wrap:wrap}
.thumb{background-color:transparent;background-image:none}
.thumb.has{background-size:cover,16px 16px;background-position:center,0 0;
  background-image:var(--t),repeating-conic-gradient(#8885 0 25%,transparent 0 50%)}
.img-actions .btn{padding:5px 10px;font-size:12px}
.item{border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:8px;background:var(--panel-2)}
.item .f input[type=text],.item .f textarea{background:var(--panel)}
.item-head{display:flex;gap:6px;align-items:center}
.item-head .n{font-family:var(--f-wide);font-size:10px;letter-spacing:.15em;color:var(--muted);margin-right:auto}
.icon-btn{width:28px;height:28px;border-radius:6px;border:1px solid var(--line);background:var(--panel);cursor:pointer;display:grid;place-items:center;font-size:13px;line-height:1}
.icon-btn:disabled{opacity:.35;cursor:default}
.hint{font-size:12px;color:var(--muted);line-height:1.55}
.card-actions{display:flex;gap:8px;flex-wrap:wrap}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px}

.preview-col{min-width:0;display:flex;flex-direction:column;gap:10px}
.pv-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;color:var(--muted);font-size:12px}
.stage{width:100%;overflow:hidden;border-radius:6px;position:relative}
.stage-inner{width:1000px;transform-origin:0 0}

/* ---------- toast & modal ---------- */
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:9px;font-size:13px;z-index:60;max-width:calc(100% - 32px);box-shadow:0 10px 30px rgba(0,0,0,.3)}
.modal{position:fixed;inset:0;background:rgba(5,6,10,.78);z-index:50;display:grid;place-items:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.modal-box{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;max-width:560px;width:100%;max-height:100%;display:flex;flex-direction:column;gap:12px}
.modal-box img{max-height:60vh;object-fit:contain;border-radius:6px;background:#000}
.modal-box p{margin:0;color:var(--muted);line-height:1.6;font-size:13px}
#export-host{position:fixed;left:-20000px;top:0;width:1000px;pointer-events:none}

/* =========================================================
   THE CARD  (fixed 1000px; everything inline-safe for html2canvas)
   ========================================================= */
.pc{--ac:#3d63ff;--pbg:#07080f;--ink:#f1f1f6;--sub:#c4c5d2;--dim:#6f7186;--rule:rgba(255,255,255,.14);
  position:relative;width:1000px;background:var(--pbg);color:var(--ink);overflow:hidden;font-family:"Noto Sans KR",sans-serif;
  -webkit-font-smoothing:antialiased}
.pc-hero{position:absolute;left:0;top:0;width:1000px;height:560px;overflow:hidden}
.pc-img{position:absolute;inset:0;background-size:cover;background-repeat:no-repeat}
.pc-hero .shade-top{position:absolute;left:0;right:0;top:0;height:140px;background:linear-gradient(to bottom,rgba(0,0,0,.5),rgba(0,0,0,0))}
.pc-hero .shade-bot{position:absolute;inset:0;background:linear-gradient(to bottom,rgba(0,0,0,0) 0%,rgba(0,0,0,0) 38%,var(--pbg-a) 70%,var(--pbg) 96%)}
.pc-hero.empty{background:radial-gradient(120% 90% at 70% 10%,var(--ac-soft),transparent 60%)}
.pc-top{position:relative;display:flex;justify-content:space-between;padding:32px 70px 0;font-family:"Michroma",sans-serif;font-size:12px;letter-spacing:.32em;color:#fff}
.pc-top b{font-family:"Syncopate",sans-serif;font-weight:700;letter-spacing:.24em}
.pc-id{position:relative;display:flex;gap:40px;align-items:flex-end;padding:236px 70px 0}
.pc-id-l{flex:1;min-width:0}
.pc-eyebrow{font-family:"Syncopate",sans-serif;font-weight:700;font-size:12.5px;letter-spacing:.3em;display:flex;align-items:center;gap:8px}
.pc-eyebrow i{width:8px;height:8px;background:var(--ac);transform:rotate(45deg);display:inline-block}
.pc-code{font-family:"Syncopate",sans-serif;font-weight:700;line-height:.92;letter-spacing:-.01em;margin:12px 0 0 -4px;white-space:nowrap;color:#f4f4fa}
.pc-stats{width:346px;flex:none;display:grid;grid-template-columns:1fr 1fr;column-gap:30px}
.pc-stat{border-top:1px solid var(--rule);padding:12px 0 18px;min-width:0}
.pc-stat .lab{font-family:"Syncopate",sans-serif;font-weight:700;font-size:10.5px;letter-spacing:.24em;color:var(--ac);display:flex;gap:7px;align-items:baseline;white-space:nowrap}
.pc-stat .lab small{font-family:"Noto Sans KR",sans-serif;font-weight:500;font-size:10px;letter-spacing:0;color:var(--dim)}
.pc-stat .val{margin-top:8px;font-family:"Noto Sans KR",sans-serif;font-weight:800;font-size:21px;line-height:1.25;letter-spacing:-.01em;word-break:keep-all}
.pc-stat .val.num{font-family:"Syncopate",sans-serif;font-weight:700;font-size:33px;line-height:1;letter-spacing:0}
.pc-stat .val .u{font-family:"Noto Sans KR",sans-serif;font-weight:500;font-size:15px;color:var(--sub);margin-left:5px;letter-spacing:0}
.pc-name{position:relative;display:flex;align-items:center;gap:18px;padding:10px 70px 0}
.pc-name .ko{font-weight:900;font-size:36px;letter-spacing:-.02em;white-space:nowrap}
.pc-name .en{font-family:"Michroma",sans-serif;font-size:15px;letter-spacing:.34em;color:var(--ac-text);white-space:nowrap}
.pc-name .ln{flex:1;height:1px;background:var(--rule)}
.pc-body{position:relative;padding:40px 70px 44px}
.pc-quote{display:flex;gap:14px;align-items:flex-start;font-weight:800;font-size:21px;line-height:1.5;margin-bottom:34px;letter-spacing:-.01em}
.pc-quote .qm{font-family:"Syncopate",sans-serif;font-weight:700;font-size:44px;line-height:.8;color:var(--ac);transform:skewX(-14deg);flex:none}
.pc-head{font-weight:900;font-size:29px;line-height:1.4;letter-spacing:-.025em;margin:0 0 20px;word-break:keep-all}
.hl{color:var(--ac-text)}
.pc-intro p{margin:0 0 20px;font-size:19px;line-height:1.86;color:var(--sub);word-break:keep-all;letter-spacing:-.005em}
.pc-intro p:last-child{margin-bottom:0}
.pc-band{position:relative;height:36px;background:var(--ac);display:flex;align-items:center;overflow:hidden;white-space:nowrap}
.pc-band-in{display:flex;align-items:center;gap:22px;margin-left:-48px;font-size:12.5px;letter-spacing:.28em}
.pc-band-in .s{font-family:"Syncopate",sans-serif;font-weight:700;color:var(--band-ink)}
.pc-band-in .w{font-family:"Michroma",sans-serif;color:var(--band-ink);opacity:.62}
.pc-band-in .d{font-size:9px;color:var(--band-ink);letter-spacing:0}
.pc-lower{position:relative;padding:30px 70px 0}
.pc-lower .glow{position:absolute;right:0;top:0;width:620px;height:760px;background:radial-gradient(60% 55% at 70% 38%,var(--ac-soft),transparent 72%)}
.pc-split{position:relative;display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:24px}
.pc-portrait{position:relative;min-height:440px}
.pc-portrait .frame{position:absolute;left:0;right:-30px;top:0;bottom:0;overflow:hidden}
.pc-portrait .fade{position:absolute;left:0;right:0;bottom:0;height:34%;background:linear-gradient(to bottom,rgba(0,0,0,0),var(--pbg))}
.pc-portrait .fade-l{position:absolute;left:0;top:0;bottom:0;width:22%;background:linear-gradient(to right,var(--pbg-a2),rgba(0,0,0,0))}
.pc-side{position:absolute;top:0;right:-58px;width:60px;height:100%;overflow:hidden}
.pc-side span{position:absolute;left:4px;top:0;transform-origin:0 0;transform:rotate(90deg) translateY(-56px);white-space:nowrap;
  font-family:"Syncopate",sans-serif;font-weight:700;font-size:48px;letter-spacing:.06em;color:var(--ac);opacity:.32;line-height:1}
.pc-secs{display:flex;flex-direction:column;gap:30px;min-width:0}
.pc-full{position:relative;display:flex;flex-direction:column;gap:30px;margin-top:30px}
.pc-sec .h{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.pc-sec .h .k{font-weight:800;font-size:20px;color:var(--ac-text);letter-spacing:-.02em;white-space:nowrap}
.pc-sec .h .e{font-family:"Michroma",sans-serif;font-size:10px;letter-spacing:.3em;color:var(--dim);white-space:nowrap}
.pc-sec .h .l{flex:1;height:1px;background:var(--rule)}
.pc-sec .b{font-size:19px;line-height:1.82;color:var(--ink);word-break:keep-all;letter-spacing:-.01em}
.pc-note{position:relative;margin:30px 0 0;font-size:14px;line-height:1.7;color:var(--dim);word-break:keep-all}
.pc-foot{position:relative;display:flex;justify-content:space-between;margin:40px 70px 0;padding:20px 0 30px;border-top:1px solid var(--rule);
  font-family:"Michroma",sans-serif;font-size:10.5px;letter-spacing:.3em;color:var(--dim)}
</style>

<header class="bar">
  <div class="brand">PROFILE <b>/</b> STUDIO</div>
  <nav class="tabs" id="tabs" aria-label="카드 목록"></nav>
  <div class="actions">
    <span class="status" id="status" aria-live="polite"></span>
    <button class="btn primary" id="btn-save" type="button">저장</button>
    <button class="btn" id="btn-png" type="button">PNG 저장</button>
    <div class="menu">
      <button class="btn ghost" id="btn-more" type="button" aria-haspopup="true" aria-expanded="false">백업 ▾</button>
      <div class="menu-pop" id="menu" hidden>
        <button type="button" data-act="export-one">이 카드 백업<small>이미지 포함 .json 파일</small></button>
        <button type="button" data-act="export-all">전체 카드 백업<small>모든 카드를 한 파일로</small></button>
        <button type="button" data-act="import">백업 불러오기<small>.json 파일에서 카드 추가</small></button>
        <button type="button" data-act="toggle-view">보기 모드 전환<small>편집 패널 숨기기/보이기</small></button>
      </div>
    </div>
  </div>
</header>

<main class="main" id="main" data-pane="edit">
  <section class="editor" id="editor" aria-label="카드 편집"></section>
  <section class="preview-col">
    <div class="seg" role="group" aria-label="화면 전환">
      <button type="button" data-pane="edit" aria-pressed="true">편집</button>
      <button type="button" data-pane="preview" aria-pressed="false">미리보기</button>
    </div>
    <div class="pv-head"><span id="pv-meta"></span><span>1000 × <span id="pv-h">—</span> px · PNG는 2배 해상도</span></div>
    <div class="stage" id="stage"><div class="stage-inner" id="stage-inner"></div></div>
  </section>
</main>
<div id="export-host" aria-hidden="true"></div>
<input type="file" id="file-img" accept="image/*" hidden>
<input type="file" id="file-json" accept="application/json,.json" hidden>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script>
(() => {
"use strict";
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid = () => "c" + Math.random().toString(36).slice(2, 8);
const DATA_PATH = "data/cards.json";
const DRAFT_KEY = "profile-studio-draft-v1";
const PRESETS = ["#ff5d73","#e5484d","#8b1e3f","#ff7a59","#ff9f1c","#ffb547","#f5c542","#c08457","#ff8fab","#ff7ad9","#c9ced6","#e8e8e8","#f2e8cf"];

let data = { version: 1, savedAt: 0, cards: [] };
let current = null;          // card id
let dirty = false;
let caps = { artifact: null, assets: null, downloads: null, user: null };
let canEdit = true;
let pendingImg = null;       // "hero" | "portrait"
let confirmDelete = false;

/* ---------- helpers ---------- */
function blankCard() {
  return {
    id: uid(), series: "SERIES", index: "01 / 01", fileLabel: "CHARACTER FILE",
    codename: "CODENAME", name: "이름", nameEn: "NAME", accent: "#3d63ff", bg: "#07080f",
    stats: [
      { label: "AGE", note: "", value: "00", unit: "세" },
      { label: "HEIGHT", note: "", value: "000", unit: "cm" },
      { label: "FROM", note: "", value: "출신", unit: "" },
      { label: "TYPE", note: "", value: "분류", unit: "" }
    ],
    quote: "", headline: "한 줄 소개에서 *강조할 부분*을 별표로 감싸세요.",
    intro: "첫 번째 문단.\n\n두 번째 문단.",
    marquee: ["CODENAME", "NAME", "SERIES"], sideText: "SIDE", besidePortrait: 3,
    sections: [
      { ko: "외형", en: "APPEARANCE", body: "" },
      { ko: "소속·직책", en: "POSITION", body: "" },
      { ko: "능력", en: "ABILITY", body: "" },
      { ko: "배경", en: "BACKGROUND", body: "" },

function downscale(file, maxSide = 1800) {
  // PNG / WebP / GIF / SVG may carry transparency: keep it as PNG. Everything else becomes JPEG.
  const keepAlpha = /png|webp|gif|svg/i.test(file.type);
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const s = Math.min(1, maxSide / Math.max(img.width, img.height));
      const cv = document.createElement("canvas"); cv.width = Math.round(img.width * s); cv.height = Math.round(img.height * s);
      cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height); URL.revokeObjectURL(url);
      cv.toBlob(b => b ? res(b) : rej(new Error("변환 실패")), keepAlpha ? "image/png" : "image/jpeg", .9);
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error("이미지를 읽지 못했어요")); };
    img.src = url;
  });
}

async function storeImage(blob) {

    catch (e) { console.warn(e); }

}

/* ---------- save ---------- */
async function save() {
  if (!caps.artifact) { toast("이 화면에서는 저장할 수 없어요. 백업 메뉴로 파일을 내보내 주세요.", 4000); return; }
  const btn = $("#btn-save"); btn.disabled = true; setStatus("저장 중…");
  try {
    // move any inline images into the asset store first
    if (caps.assets) for (const c of data.cards) for (const k of ["hero", "portrait"]) {
      if (c[k].src && c[k].src.startsWith("data:")) { const b = await (await fetch(c[k].src)).blob(); c[k].src = await storeImage(b); }
    }
    data.savedAt = Date.now();
    await caps.artifact.publish({ [DATA_PATH]: { content: JSON.stringify(data, null, 1), contentType: "application/json" } });
    dirty = false; setStatus("저장됨", "ok");
    try { localStorage.removeItem(DRAFT_KEY); } catch (e) {}
  } catch (err) {
    const code = err && err.code;
    const msg = code === "conflict" ? "다른 곳에서 먼저 저장했어요. 최신 내용으로 새로고침돼요."
      : code === "not_writer" || code === "not_granted" ? "이 카드집을 저장할 권한이 없어요."
      : code === "capability_disabled" ? "공개 링크 보기에서는 저장할 수 없어요. 백업 파일로 내보내 주세요."
      : code === "too_large" ? "데이터가 너무 커요. 이미지를 줄이거나 카드를 나눠 주세요."
      : "저장하지 못했어요" + (code ? ` (${code})` : "");
    setStatus("저장 실패", "err"); toast(msg, 4500);
  } finally { btn.disabled = false; }
}
$("#btn-save").addEventListener("click", save);
document.addEventListener("keydown", e => { if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "s") { e.preventDefault(); save(); } });

/* ---------- file delivery ---------- */
async function deliver(filename, blob, previewURL) {
  if (caps.downloads) {
    try { await caps.downloads.save({ filename, data: blob }); toast("저장했어요"); return; }
    catch (e) { if (e && e.code === "declined") return; console.warn(e); }
  }
  // fallback: show it so the viewer can long-press / right-click save
  const url = previewURL || URL.createObjectURL(blob);
  const m = document.createElement("div"); m.className = "modal";
  m.innerHTML = `<div class="modal-box" role="dialog" aria-label="파일 저장"><strong>${esc(filename)}</strong>
    ${blob.type.startsWith("image/") ? `<img src="${url}" alt="">` : ""}
    <p>${blob.type.startsWith("image/") ? "이미지를 길게 누르거나 우클릭해서 저장하세요." : "이 화면에서는 파일 저장이 막혀 있어요. 아래 내용을 복사해 .json 파일로 보관하세요."}</p>
    ${blob.type.startsWith("image/") ? "" : `<textarea id="bk-text" rows="6" readonly style="width:100%;background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:8px"></textarea><button class="btn" type="button" data-copy>복사</button>`}
    <button class="btn primary" type="button" data-close>닫기</button></div>`;
  document.body.appendChild(m);
  if (!blob.type.startsWith("image/")) $("#bk-text", m).value = await blob.text();
  m.addEventListener("click", e => {
    if (e.target === m || e.target.closest("[data-close]")) m.remove();
    if (e.target.closest("[data-copy]")) { const t = $("#bk-text", m); navigator.clipboard.writeText(t.value).then(() => toast("복사했어요"), () => { t.select(); }); }
  });
}
const safeName = s => String(s || "card").replace(/[\\/:*?"<>|\s]+/g, "_").slice(0, 60);

/* ---------- PNG ---------- */
async function waitImages(root) {
  const urls = [...root.querySelectorAll(".pc-img")].map(el => (el.style.backgroundImage.match(/url\(["']?(.*?)["']?\)/) || [])[1]).filter(Boolean);
  await Promise.all(urls.map(u => new Promise(r => { const i = new Image(); i.onload = i.onerror = r; i.src = u; })));
}
$("#btn-png").addEventListener("click", async () => {
  const c = card(); if (!c) return;
  if (!window.html2canvas) { toast("이미지 변환 도구를 불러오지 못했어요. 새로고침 후 다시 시도해 주세요."); return; }
  const btn = $("#btn-png"); btn.disabled = true; setStatus("PNG 만드는 중…");
  const host = $("#export-host");
  try {
    await fontsReady;
    host.innerHTML = renderCard(c); fitCode(host);
    await waitImages(host);
    const el = host.firstElementChild;
    const canvas = await html2canvas(el, { scale: 2, backgroundColor: c.bg, useCORS: true, logging: false, width: 1000, height: el.offsetHeight, windowWidth: 1200 });
    const blob = await new Promise(r => canvas.toBlob(r, "image/png"));
    setStatus(dirty ? "저장 안 됨" : "", dirty ? "dirty" : "");
    await deliver(`${safeName(c.codename)}_${safeName(c.nameEn)}.png`, blob);
  } catch (err) { console.error(err); setStatus("PNG 실패", "err"); toast("PNG를 만들지 못했어요: " + (err.message || err)); }
  finally { host.innerHTML = ""; btn.disabled = false; }
});

/* ---------- backup ---------- */
async function inlineImages(c) {
  c = JSON.parse(JSON.stringify(c));
  for (const k of ["hero", "portrait"]) {
    const s = c[k] && c[k].src;
    if (s && !s.startsWith("data:")) { try { c[k].src = await blobToDataURL(await (await fetch(s)).blob()); } catch (e) {} }
  }
  return c;
}
async function exportCards(list, name) {
  setStatus("백업 파일 만드는 중…");
  const cards = []; for (const c of list) cards.push(await inlineImages(c));
  const blob = new Blob([JSON.stringify({ app: "profile-studio", version: 1, exportedAt: new Date().toISOString(), cards }, null, 1)], { type: "application/json" });
  setStatus(dirty ? "저장 안 됨" : "", dirty ? "dirty" : "");
  await deliver(name, blob);
}
$("#file-json").addEventListener("change", async e => {
  const f = e.target.files[0]; if (!f) return;
  try {
    const j = JSON.parse(await f.text());
    const list = Array.isArray(j) ? j : (j.cards || (j.codename ? [j] : []));
    if (!list.length) throw new Error("카드가 들어 있지 않은 파일이에요");
    let last;
    for (const raw of list) {
      const c = normalize(raw);
      if (data.cards.some(x => x.id === c.id)) c.id = uid();
      data.cards.push(c); last = c.id;
    }
    markDirty(); select(last); toast(`${list.length}개 카드를 불러왔어요. 저장하면 사이트에 반영돼요.`, 3500);
  } catch (err) { toast("불러오지 못했어요: " + err.message, 4000); }
});
const menu = $("#menu"), more = $("#btn-more");
more.addEventListener("click", e => { e.stopPropagation(); menu.hidden = !menu.hidden; more.setAttribute("aria-expanded", String(!menu.hidden)); });
document.addEventListener("click", e => { if (!e.target.closest(".menu")) { menu.hidden = true; more.setAttribute("aria-expanded", "false"); } });
menu.addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return; menu.hidden = true;
  const c = card();
  if (b.dataset.act === "export-one" && c) exportCards([c], `${safeName(c.codename)}_backup.json`);
  if (b.dataset.act === "export-all") exportCards(data.cards, `profile_cards_backup.json`);
  if (b.dataset.act === "import") { $("#file-json").value = ""; $("#file-json").click(); }
  if (b.dataset.act === "toggle-view") { $("#main").classList.toggle("view"); renderTabs(); scalePreview(); }
});

/* ---------- mobile pane toggle ---------- */
document.querySelector(".seg").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  $("#main").dataset.pane = b.dataset.pane;
  document.querySelectorAll(".seg button").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
  scalePreview();
});

/* ---------- boot ---------- */
async function boot() {
  try {
    const r = await fetch(DATA_PATH, { cache: "no-store" });
    if (r.ok) { const j = await r.json(); data = { version: 1, savedAt: j.savedAt || 0, cards: (j.cards || []).map(normalize) }; }
  } catch (e) { console.warn("no data file", e); }
  try {
    const d = JSON.parse(localStorage.getItem(DRAFT_KEY) || "null");
    if (d && d.data && (d.base || 0) === (data.savedAt || 0) && Array.isArray(d.data.cards)) {
      data = { version: 1, savedAt: d.base || 0, cards: d.data.cards.map(normalize) };
      dirty = true; setStatus("저장 안 된 수정 내용을 불러왔어요", "dirty");
    }
  } catch (e) {}
  if (!data.cards.length) data.cards.push(blankCard());
  select(location.hash.slice(1) || data.cards[0].id);

  if (window.claude && claude.use) {
    const [a, as, dl, u] = await Promise.all(["artifact", "assets", "downloads", "user"].map(n => claude.use(n).catch(() => null)));
    caps = { artifact: a, assets: as, downloads: dl, user: u, ready: true };
    if (u) { try { canEdit = await u.canEdit(); } catch (e) {} }
  } else caps.ready = true;
  if (!canEdit) {
    $("#main").classList.add("view"); $("#btn-save").hidden = true;
    menu.querySelector('[data-act="import"]').hidden = true;
  }
  renderTabs(); renderForm();
}
window.addEventListener("beforeunload", e => { if (dirty && caps.artifact) { e.preventDefault(); } });
boot();
})();
</script>
